<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">REXONDEX geometric monolith</title>
  <desc id="desc">검은 바탕 위에 떠 있는 형이상학적 다면체 문양</desc>
  <rect width="64" height="64" rx="14" fill="#0f1115"/>

  <!-- 하나의 불가능한 다면체처럼 읽히는 세 개의 면 -->
  <path d="M32 7 54 20 45 33 32 27 19 33 10 20Z" fill="#fff"/>
  <path d="m10 20 9 13 13-6v30L13 46Z" fill="#d8dbe2"/>
  <path d="m54 20-9 13-13-6v30l19-11Z" fill="#858b98"/>

  <!-- 중심의 빈 공간은 눈, 문, 기록의 핵을 상징 -->
  <path d="m32 27 13 6-13 8-13-8Z" fill="#0f1115"/>
  <circle cx="32" cy="34" r="2.4" fill="#fff"/>

  <!-- 축소했을 때에도 실루엣을 묶어 주는 외곽선 -->
  <path d="M32 7 54 20l-3 26-19 11-19-11-3-26Z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
